services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ypgym-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ypgym}
      POSTGRES_USER: ${POSTGRES_USER:-ypgym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ypgym_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ypgym} -d ${POSTGRES_DB:-ypgym}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-cache:
    image: redis:7-alpine
    container_name: ypgym-redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    profiles: ["app", "iot"]
    build:
      context: ./backend
    container_name: ypgym-backend-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      MOBILE_APP_URL: ${MOBILE_APP_URL:-ypgym://}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://localhost:8081,http://localhost:8082,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:19006}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ypgym}:${POSTGRES_PASSWORD:-ypgym_dev_password}@postgres-db:5432/${POSTGRES_DB:-ypgym}
      REDIS_URL: redis://redis-cache:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      QR_TOKEN_TTL_SECONDS: 60
      ATTENDANCE_TIMEOUT_MINUTES: 180
      GYM_CAPACITY: 150
      IOT_DEVICE_API_KEY: ${IOT_DEVICE_API_KEY:-local-iot-key}
      DEVELOPMENT_SEED_PASSWORD: ${DEVELOPMENT_SEED_PASSWORD:-YPGymDemo123!}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-development}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-YPGym Team}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      DEVELOPMENT_MAIL_DIR: ${DEVELOPMENT_MAIL_DIR:-storage/mail}
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend-web:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: ypgym-frontend-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8001}/api/v1
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-api
    command: npm run dev -- --host 0.0.0.0

  celery-worker:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: ypgym-celery-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ypgym}:${POSTGRES_PASSWORD:-ypgym_dev_password}@postgres-db:5432/${POSTGRES_DB:-ypgym}
      REDIS_URL: redis://redis-cache:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-development}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-YPGym Team}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_MAX_DELIVERY_ATTEMPTS: ${EMAIL_MAX_DELIVERY_ATTEMPTS:-5}
      EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS:-300}
      EMAIL_DELIVERY_BATCH_SIZE: ${EMAIL_DELIVERY_BATCH_SIZE:-25}
      DEVELOPMENT_MAIL_DIR: ${DEVELOPMENT_MAIL_DIR:-storage/mail}
    volumes:
      - ./backend:/app
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

  celery-beat:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: ypgym-celery-beat
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ypgym}:${POSTGRES_PASSWORD:-ypgym_dev_password}@postgres-db:5432/${POSTGRES_DB:-ypgym}
      REDIS_URL: redis://redis-cache:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-secret}
    volumes:
      - ./backend:/app
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

  iot-simulator:
    profiles: ["iot"]
    build:
      context: ./iot-simulator
    container_name: ypgym-iot-simulator
    restart: "no"
    environment:
      API_BASE_URL: http://backend-api:8000/api/v1
      IOT_DEVICE_ID: local-simulator-1
      IOT_DEVICE_API_KEY: ${IOT_DEVICE_API_KEY:-local-iot-key}
    depends_on:
      - backend-api
    command: python -m app.main

volumes:
  postgres_data:
  redis_data:
