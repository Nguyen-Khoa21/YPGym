# Standalone, local-only demo. Never merge with docker-compose.yml.
# Project-scoped resources; no fixed container names or normal application volumes.
name: ypgym-demo

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://ypgym_demo:local-demo-only@postgres-db:5432/ypgym_demo
  REDIS_URL: redis://redis-cache:6379/0
  JWT_SECRET_KEY: local-demo-signing-key-never-use-in-production
  IOT_DEVICE_API_KEY: local-demo-scanner-key
  DEVELOPMENT_SEED_PASSWORD: YPGymDemo123!
  FRONTEND_URL: http://localhost:55174
  CORS_EXTRA_ORIGINS: http://localhost:8081,http://localhost:8082,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:19006
  INVOICE_STORAGE_DIR: /app/storage/invoices
  DEVELOPMENT_MAIL_DIR: /app/storage/mail
  EMAIL_DELIVERY_MODE: development
  EMAIL_SENDER_NAME: YPGym Team
  EMAIL_SENDER_ADDRESS: no-reply@example.com

x-backend: &backend
  build: ./backend
  environment: *backend-environment
  volumes:
    - ./backend:/app:ro
    - demo_storage:/app/storage

services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ypgym_demo
      POSTGRES_USER: ypgym_demo
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ypgym_demo -d ypgym_demo"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend-api:
    <<: *backend
    ports:
      - "127.0.0.1:58001:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed --demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/dependencies', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30

  frontend-web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:58001/api/v1
    ports:
      - "127.0.0.1:55174:5173"
    depends_on:
      backend-api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

  celery-worker:
    <<: *backend
    depends_on:
      backend-api:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

  celery-beat:
    <<: *backend
    depends_on:
      backend-api:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  demo_postgres:
  demo_storage:
